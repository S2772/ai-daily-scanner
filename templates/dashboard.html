<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI热点日报 · 智能看板</title>
  <link rel="stylesheet" href="/static/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <i class="fas fa-bolt"></i>
        <span>AI热点日报</span>
      </div>
      <div class="nav-actions">
        <button id="collect-btn" class="nav-btn primary">
          <i class="fas fa-sync-alt"></i>
          <span>收集热点</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- 主内容区域 -->
  <main class="main-container">
    <!-- 左侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <h3><i class="fas fa-chart-line"></i> 今日概览</h3>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon">
              <i class="fas fa-fire"></i>
            </div>
            <div class="stat-content">
              <div class="stat-value" id="hotspot-count">0</div>
              <div class="stat-label">热点</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">
              <i class="fas fa-gem"></i>
            </div>
            <div class="stat-content">
              <div class="stat-value" id="opportunity-count">0</div>
              <div class="stat-label">机会</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">
              <i class="fas fa-sticky-note"></i>
            </div>
            <div class="stat-content">
              <div class="stat-value" id="note-count">0</div>
              <div class="stat-label">笔记</div>
            </div>
          </div>
        </div>
      </div>

      <div class="sidebar-section">
        <h3><i class="fas fa-satellite-dish"></i> 来源状态</h3>
        <div id="source-status-list" class="source-status-list">
          <p class="status-placeholder">等待加载来源状态...</p>
        </div>
      </div>

      <div class="sidebar-section">
        <h3><i class="fas fa-filter"></i> 筛选器</h3>
        <div class="filter-group">
          <div class="filter-header">
            <span>分类</span>
            <button class="filter-clear">清除</button>
          </div>
          <div class="filter-options" id="category-filters">
            <!-- 动态生成 -->
          </div>
        </div>
        <div class="filter-group">
          <div class="filter-header">
            <span>标签</span>
            <button class="filter-clear">清除</button>
          </div>
          <div class="filter-tags" id="tag-filters">
            <!-- 动态生成 -->
          </div>
        </div>
      </div>

      <div class="sidebar-section">
        <h3><i class="fas fa-cog"></i> 视图设置</h3>
        <div class="view-toggle">
          <button class="view-btn active" data-view="grid">
            <i class="fas fa-th-large"></i>
            <span>网格视图</span>
          </button>
          <button class="view-btn" data-view="list">
            <i class="fas fa-list"></i>
            <span>列表视图</span>
          </button>
        </div>
        <div class="sort-options">
          <label for="sort-select">排序方式</label>
          <select id="sort-select">
            <option value="score">综合评分</option>
            <option value="date">最新发布</option>
            <option value="innovation">创新度</option>
            <option value="commercial">商业潜力</option>
          </select>
        </div>
      </div>
    </aside>

    <!-- 主要内容区 -->
    <div class="content-area">
      <!-- 内容头部 -->
      <div class="content-header">
        <div class="header-left">
          <h1>AI热点分析</h1>
          <p id="status" class="status-text">系统就绪</p>
        </div>
        <div class="header-right">
          <div class="date-picker">
            <i class="fas fa-calendar-alt"></i>
            <input id="date-input" type="date" value="__TODAY__">
          </div>
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" placeholder="搜索热点、机会...">
          </div>
          <button id="refresh-btn" class="action-btn">
            <i class="fas fa-redo"></i>
            <span>刷新</span>
          </button>
          <div class="dropdown">
            <button id="export-btn" class="action-btn">
              <i class="fas fa-download"></i>
              <span>导出</span>
            </button>
            <div class="dropdown-content">
              <a href="#" id="export-hotspots-csv">导出热点 (CSV)</a>
              <a href="#" id="export-opportunities-csv">导出机会 (CSV)</a>
            </div>
          </div>
        </div>
      </div>

      <!-- 标签导航 -->
      <div class="tab-nav">
        <button class="tab-btn active" data-tab="hotspots">
          <i class="fas fa-fire"></i>
          <span>热点</span>
          <span class="tab-badge" id="hotspots-badge">0</span>
        </button>
        <button class="tab-btn" data-tab="opportunities">
          <i class="fas fa-gem"></i>
          <span>机会</span>
          <span class="tab-badge" id="opportunities-badge">0</span>
        </button>
        <button class="tab-btn" data-tab="notes">
          <i class="fas fa-sticky-note"></i>
          <span>笔记</span>
          <span class="tab-badge" id="notes-badge">0</span>
        </button>
        <button class="tab-btn" data-tab="analysis">
          <i class="fas fa-chart-bar"></i>
          <span>分析</span>
        </button>
        <button class="tab-btn" data-tab="sources">
          <i class="fas fa-satellite-dish"></i>
          <span>信息源</span>
        </button>
      </div>

      <!-- 内容区域 -->
      <div class="tab-content">
        <!-- 热点标签页 -->
        <div class="tab-pane active" id="hotspots-pane">
          <div class="view-controls">
            <div class="view-info">
              <span id="hotspots-count">0 个项目</span>
              <span class="view-separator">|</span>
              <span id="hotspots-filter-info">全部</span>
            </div>
            <div class="view-actions">
              <button class="action-btn small" id="export-hotspots">
                <i class="fas fa-download"></i>
                <span>导出</span>
              </button>
            </div>
          </div>
          <div class="content-grid" id="hotspots-grid">
            <!-- 网格视图 -->
          </div>
          <div class="content-list" id="hotspots-list" style="display: none;">
            <!-- 列表视图 -->
          </div>
        </div>

        <!-- 机会标签页 -->
        <div class="tab-pane" id="opportunities-pane">
          <div class="view-controls">
            <div class="view-info">
              <span id="opportunities-count">0 个机会</span>
              <span class="view-separator">|</span>
              <span id="opportunities-filter-info">全部</span>
            </div>
            <div class="view-actions">
              <button class="action-btn small" id="export-opportunities">
                <i class="fas fa-download"></i>
                <span>导出</span>
              </button>
            </div>
          </div>
          <div class="opportunities-grid" id="opportunities-content">
            <!-- 机会内容 -->
          </div>
        </div>

        <!-- 笔记标签页 -->
        <div class="tab-pane" id="notes-pane">
          <div class="notes-container">
            <div class="notes-editor">
              <h3><i class="fas fa-edit"></i> 新建笔记</h3>
              <form id="note-form" class="note-form">
                <div class="form-group">
                  <label for="note-hotspot-id">关联热点</label>
                  <select id="note-hotspot-id" name="hotspot_id">
                    <option value="">选择热点...</option>
                    <!-- 动态生成 -->
                  </select>
                </div>
                <div class="form-group">
                  <label for="note-content">笔记内容</label>
                  <textarea id="note-content" name="content" rows="6" placeholder="记录你的见解、分析和行动计划..."></textarea>
                </div>
                <div class="form-group">
                  <label for="note-tags">标签</label>
                  <div class="tags-input">
                    <input type="text" id="note-tags-input" placeholder="输入标签后按回车...">
                    <div class="tags-container" id="note-tags-container"></div>
                  </div>
                </div>
                <div class="form-actions">
                  <button type="submit" class="action-btn primary">
                    <i class="fas fa-save"></i>
                    <span>保存笔记</span>
                  </button>
                  <button type="button" class="action-btn" id="clear-note">
                    <i class="fas fa-times"></i>
                    <span>清空</span>
                  </button>
                </div>
              </form>
            </div>
            <div class="notes-list">
              <h3><i class="fas fa-history"></i> 历史笔记</h3>
              <div id="notes-list" class="notes-list-content">
                <!-- 笔记列表 -->
              </div>
            </div>
          </div>
        </div>

        <!-- 分析标签页 -->
        <div class="tab-pane" id="analysis-pane">
          <div class="analysis-container">
            <div class="analysis-card">
              <h3><i class="fas fa-chart-pie"></i> 热点分布</h3>
              <div class="chart-placeholder" id="category-chart">
                <p>图表加载中...</p>
              </div>
            </div>
            <div class="analysis-card">
              <h3><i class="fas fa-trend-up"></i> 趋势分析</h3>
              <div class="analysis-content">
                <div class="trend-item">
                  <div class="trend-label">今日热点数量</div>
                  <div class="trend-value" id="trend-hotspots">0</div>
                  <div class="trend-change" id="trend-hotspots-change">+0%</div>
                </div>
                <div class="trend-item">
                  <div class="trend-label">平均创新度</div>
                  <div class="trend-value" id="trend-innovation">0.0</div>
                  <div class="trend-change" id="trend-innovation-change">+0%</div>
                </div>
                <div class="trend-item">
                  <div class="trend-label">平均商业潜力</div>
                  <div class="trend-value" id="trend-commercial">0.0</div>
                  <div class="trend-change" id="trend-commercial-change">+0%</div>
                </div>
              </div>
            </div>
            <div class="analysis-card full-width">
              <h3><i class="fas fa-lightbulb"></i> 摘要分析</h3>
              <div class="summary-content" id="summary-analysis">
                <p>收集热点数据后，系统将自动生成今日AI领域的趋势摘要和关键洞察。</p>
              </div>
            </div>
          </div>
        </div>

      <!-- 信息源标签页 -->
      <div class="tab-pane" id="sources-pane">
        <div class="sources-toolbar">
          <div class="sources-search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="sources-search-input" placeholder="搜索信息源名称...">
          </div>
          <select id="sources-type-filter" class="sources-filter-select">
            <option value="">全部类型</option>
            <option value="wechat">微信公众号</option>
            <option value="rss">RSS订阅</option>
            <option value="twitter">Twitter博主</option>
            <option value="official_blog">官方研究博客</option>
            <option value="cn_model_lab">国内模型实验室</option>
            <option value="thought_leader">思想领袖</option>
            <option value="investment">投资机构</option>
            <option value="podcast">播客/平台</option>
            <option value="industry">产业分析</option>
          </select>
          <button class="action-btn primary" id="add-source-btn">
            <i class="fas fa-plus"></i>
            <span>添加信息源</span>
          </button>
        </div>
        <div id="sources-stats" class="sources-stats"></div>
        <div id="sources-content" class="sources-content">
          <div class="loading-state"><div class="loading-spinner"></div><p>加载信息源...</p></div>
        </div>
      </div>

      </div>
    </div>
  </main>

<!-- 添加信息源模态框 -->
<div id="add-source-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:2000;">
  <div id="add-source-modal-overlay" style="position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);"></div>
  <div style="position:relative;width:90%;max-width:500px;margin:5% auto;background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden;">
    <div class="modal-header">
      <h2>添加信息源</h2>
      <button class="modal-close" id="add-source-modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <form id="add-source-form" class="note-form">
        <div class="form-group">
          <label>名称 *</label>
          <input type="text" id="new-source-name" placeholder="信息源名称" class="source-form-input">
        </div>
        <div class="form-group">
          <label>类型</label>
          <select id="new-source-type" class="source-form-input">
            <option value="rss">RSS订阅</option>
            <option value="twitter">Twitter博主</option>
            <option value="official_blog">官方研究博客</option>
            <option value="podcast">播客/平台</option>
            <option value="industry">产业分析</option>
            <option value="investment">投资机构</option>
          </select>
        </div>
        <div class="form-group">
          <label>URL</label>
          <input type="text" id="new-source-url" placeholder="https://..." class="source-form-input">
        </div>
        <div class="form-group">
          <label>备注</label>
          <textarea id="new-source-note" rows="3" placeholder="可选备注..." class="source-form-input"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="action-btn primary"><i class="fas fa-save"></i><span>保存</span></button>
          <button type="button" class="action-btn" id="cancel-add-source"><i class="fas fa-times"></i><span>取消</span></button>
        </div>
      </form>
    </div>
  </div>
</div>

  <!-- 热点详情模态框 -->
  <div class="modal" id="hotspot-modal">
    <div class="modal-overlay" id="hotspot-modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="hotspot-modal-title">热点详情</h2>
        <button class="modal-close" id="hotspot-modal-close">&times;</button>
      </div>
      <div class="modal-body" id="hotspot-modal-content">
        <!-- 动态内容 -->
      </div>
      <div class="modal-footer">
        <button class="action-btn" id="hotspot-modal-close-btn">关闭</button>
        <button class="action-btn primary" id="hotspot-modal-add-note">
          <i class="fas fa-plus"></i>
          <span>添加笔记</span>
        </button>
      </div>
    </div>
  </div>

  <script src="/static/dashboard.js"></script>
</body>
</html>
